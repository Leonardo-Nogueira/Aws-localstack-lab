services:
  localstack:
    image: localstack/localstack-pro:latest
    container_name: aws-localstack-lab
    ports:
      - "4566:4566"            # Porta Unificada (Edge Port) para todos os servicos da AWS
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      - SERVICES=s3,sqs,sns,dynamodb,ssm,secretsmanager,sts,iam
      - DEFAULT_REGION=us-east-1
      - DEBUG=0
      - EXTRA_CORS_ALLOWED_ORIGINS=*
      - EXTRA_CORS_ALLOWED_HEADERS=*
    volumes:
      # Todo script .sh dentro de /etc/localstack/init/ready.d roda automaticamente quando o LocalStack fica pronto!
      - ./localstack-init:/etc/localstack/init/ready.d
      - "/var/run/docker.sock:/var/run/docker.sock"
